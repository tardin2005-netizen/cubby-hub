<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubby — central da marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Tokens: sistema de design Cubby (claro / escuro) */
:root{
  --display:"Archivo",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
}
[data-theme=light]{color-scheme:light;
  --bg:#F2F4F7;--panel:#FFFFFF;--tx:#0E1726;--mut:#586477;--line:#D6DCE5;--brand:#16284A;--on-brand:#FFFFFF;
  --acc:#F26B21;--on-acc:#0E1726;--acc-ink:#B8420A;--tape:#FFC83D;--on-tape:#0E1726;--tape-soft:#DEE3EB;--pos:#1D6E64;--caut:#8A5A08;--danger:#B3261E}
[data-theme=dark]{color-scheme:dark;
  --bg:#0E1726;--panel:#16284A;--tx:#F2F4F7;--mut:#A9B4C6;--line:#2B3E63;--brand:#8FA8DB;--on-brand:#0E1726;
  --acc:#FF8A4C;--on-acc:#0E1726;--acc-ink:#FF9A66;--tape:#FFC83D;--on-tape:#0E1726;--tape-soft:#22365C;--pos:#5BC0AE;--caut:#E5B25D;--danger:#FF8A80}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 16px/24px var(--sans);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.label,.pill,.chip,.eyebrow,.ok,.no{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.spec{font:500 13px/18px var(--mono)}
.app{display:grid;grid-template-columns:272px 1fr;height:100vh;transition:grid-template-columns .2s}
.app.nosb{grid-template-columns:0 1fr}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:hidden auto;display:flex;flex-direction:column;min-width:0}
.app.nosb .side{border:0;visibility:hidden}
.side>*{width:272px;flex-shrink:0}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:var(--space-6) var(--space-4) var(--space-3)}
#brandLogo{height:38px;width:auto;display:block}
.brand b{font:800 18px/22px var(--display);letter-spacing:-.01em;display:block}
.brand small{font:600 11px/14px var(--sans);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#sideMark svg{width:36px;height:36px;display:block}
#nav{flex:1;padding-bottom:var(--space-3)}
.item{display:block;padding:8px 14px 8px 48px;color:var(--mut);text-decoration:none;border-radius:var(--radius-md);margin:1px 10px;font-size:14px;line-height:20px}
.item:hover{background:var(--tape-soft);color:var(--tx)}
.item.on{background:color-mix(in srgb,var(--cc) 12%,transparent);color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--cc)}
.item.home{padding-left:16px;--cc:var(--brand);margin-top:6px}
.cat{margin:20px 14px 4px;display:flex;align-items:center;gap:var(--space-2)}
.chev{width:28px;height:28px;border-radius:var(--radius-sm);border:1.5px solid var(--cc);color:var(--cc);display:grid;place-items:center;background:transparent;padding:0}
.chev svg{transition:transform .18s}
.cat.closed .chev svg{transform:rotate(-90deg)}
.chev:hover{background:color-mix(in srgb,var(--cc) 14%,transparent)}
.pill{border:1.5px solid var(--cc);color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,transparent);border-radius:var(--radius-sm);padding:3px 10px;display:inline-block}
.side-foot{border-top:1px solid var(--line);padding:var(--space-3) var(--space-4);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);color:var(--mut)}
main{min-width:0;overflow:auto;height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-6);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.icon{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.icon:hover{border-color:var(--brand)}
.crumb{color:var(--mut)}
.crumb b{color:var(--tx);font-weight:600}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-md);padding:2px;gap:2px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font:600 12px/16px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.avatar{width:36px;height:36px;border-radius:var(--radius-md);background:var(--brand);color:var(--on-brand);font:800 13px/36px var(--display);text-align:center;letter-spacing:.02em}
.proto{margin:var(--space-4) var(--space-8) 0;padding:10px var(--space-4);background:var(--tape-soft);border-radius:var(--radius-md);display:flex;gap:var(--space-3);align-items:center;justify-content:space-between;font-size:14px;line-height:20px;color:var(--mut)}
.proto>div{display:flex;gap:var(--space-3);align-items:center}
.proto button{border:0;background:none;color:var(--mut);font-size:18px;padding:0 4px}
.selo{background:var(--tape);color:var(--on-tape);border-radius:var(--radius-sm);padding:2px 8px;font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.ph{padding:var(--space-8) var(--space-8) var(--space-2)}
.eyebrow{color:var(--acc-ink)}
.ph h1{font:800 32px/36px var(--display);letter-spacing:-.01em;margin:var(--space-2) 0}
.ph.hero h1{font:800 56px/56px var(--display);letter-spacing:-.02em;max-width:17ch}
.ph p{color:var(--mut);max-width:62ch;margin:0}
.wrap{padding:var(--space-4) var(--space-8) 72px}
.view{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font:700 20px/26px var(--display);margin:var(--space-8) 0 4px}
h2+p{margin:0 0 var(--space-4);color:var(--mut);font-size:14px;line-height:20px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:var(--radius-md);padding:7px 12px;font:600 13px/18px var(--sans);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.m{font:500 13px/18px var(--mono)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.pri.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;line-height:16px}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 11px;color:var(--tx);font:400 15px/22px var(--sans)}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
label.f{display:grid;gap:5px;font:600 12px/16px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--space-4)}
.tile{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:inherit;transition:.18s;position:relative;overflow:hidden}
.tile:hover{border-color:var(--cc);transform:translateY(-3px)}
.tile .deco{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
.tile .deco svg{width:76px;height:auto;max-height:76px}
.tile h3{margin:0;font:700 20px/26px var(--display)}
.tile small{color:var(--mut);font-size:13px;line-height:18px}
.tile.empty{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;gap:var(--space-3);color:var(--mut);cursor:default}
.tile.empty:hover{transform:none;border-color:var(--line)}
.tile.empty i{display:block;width:30%;aspect-ratio:1;background:var(--acc);border-radius:var(--radius-sm)}
.sqs{display:grid;grid-template-columns:repeat(2,26px);gap:var(--space-2)}
.sqs i{width:26px;height:26px;border-radius:var(--radius-sm);display:block;border:1px solid var(--line)}
.aa{font:800 54px/1 var(--display);letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--space-4)}
.slot{display:flex;flex-direction:column;gap:var(--space-3)}
.slot h3{margin:0;font:700 18px/24px var(--display)}
.slot p{margin:2px 0 0;color:var(--mut);font-size:14px;line-height:20px}
.stage{height:196px;border-radius:var(--radius-md);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}
.stage svg,.stage img{max-width:80%;max-height:72%;width:auto;height:auto}
.stage svg{width:80%}
.checker{background-image:linear-gradient(45deg,rgba(128,128,128,.16) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.16) 75%),linear-gradient(45deg,rgba(128,128,128,.16) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.16) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.warn{margin:0;color:var(--caut);font-size:13px;line-height:18px}
input[type=file]{display:none}
.sw{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--panel)}
.sw .c{height:112px;display:flex;align-items:flex-end;padding:10px;cursor:pointer}
.sw .b{padding:10px;display:grid;gap:var(--space-2)}
.sw .hex{display:flex;gap:var(--space-2)}
.sw input[type=color]{width:40px;height:38px;padding:0;border:1px solid var(--line);border-radius:var(--radius-md);background:none;cursor:pointer}
.fontcard .big{font-size:46px;line-height:1.05;letter-spacing:-.02em;margin:12px 0 8px;word-break:break-word}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--space-4)}
.rule{display:flex;flex-direction:column;gap:10px}
.rule .demo{height:130px;border-radius:var(--radius-md);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.rule .demo svg{width:70%;height:auto;max-height:80%}
.rule b{font:700 16px/22px var(--display)}
.rule span.d{font-size:14px;line-height:20px;color:var(--mut)}
.ok,.no{padding:2px 8px;border-radius:var(--radius-sm);display:inline-block;width:max-content}
.ok{color:var(--pos);border:1.5px solid var(--pos)}.no{color:var(--danger);border:1.5px solid var(--danger)}
.fields{display:grid;gap:var(--space-3);max-width:760px}
.fld{display:grid;grid-template-columns:1fr auto;gap:var(--space-2);align-items:end}
.lock{max-width:460px;margin:var(--space-6) auto 0;display:grid;gap:var(--space-4)}
.lock h3{margin:0;font:800 24px/28px var(--display)}
.lock p{margin:0;color:var(--mut);font-size:14px;line-height:20px}
.msg{font-size:14px;color:var(--danger);min-height:20px}
.vbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--space-4)}
.vbar .inp{max-width:280px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:var(--space-3)}
.chip{border:1.5px solid var(--cc,var(--line));color:var(--cc,var(--mut));background:transparent;border-radius:var(--radius-sm);padding:3px 10px}
.chip.on{background:color-mix(in srgb,var(--cc,var(--tx)) 14%,transparent)}
.entries{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);overflow:hidden}
.entry{display:grid;grid-template-columns:1.3fr 1fr 1.2fr auto;gap:var(--space-4);align-items:center;padding:13px var(--space-4);border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .tt{font:700 16px/22px var(--display)}
.entry .sub{color:var(--mut);font-size:13px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .pw{word-break:break-all;letter-spacing:.06em}
.empty{padding:var(--space-12);text-align:center;color:var(--mut)}
.shelf .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.shelf .it:last-child{border:0}
.shelf .it small{color:var(--mut)}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--radius-lg);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgba(14,23,38,.62)}
.dlg{padding:var(--space-6);display:grid;gap:var(--space-3)}
.dlg h3{margin:0;font:800 20px/26px var(--display)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--brand);color:var(--on-brand);padding:9px var(--space-4);border-radius:var(--radius-md);font:600 13px/18px var(--sans);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:272px;z-index:20;box-shadow:12px 0 40px rgba(0,0,0,.4)}
 .app.nosb .side{display:none}
 .ph,.wrap{padding-left:var(--space-4);padding-right:var(--space-4)}.proto{margin-left:var(--space-4);margin-right:var(--space-4)}
 .entry{grid-template-columns:1fr;gap:6px}
 .ph.hero h1{font-size:40px;line-height:42px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><img id="brandLogo" alt="Cubby"><small>central da marca</small></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="spec" id="vaultState">cofre · bloqueado</span><button class="btn sm" id="btnLock" style="display:none">Bloquear</button><button class="btn sm" id="btnOut">Sair</button></div>
  </aside>
  <main>
    <header class="top">
      <button class="icon" id="toggleSide" aria-label="Mostrar ou esconder o menu"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="crumb label" id="crumb"></div>
      <div class="spacer"></div>
      <div class="seg" id="themeSeg"><button data-t="light">Claro</button><button data-t="dark">Escuro</button></div>
      <span class="avatar" aria-hidden="true">JT</span>
    </header>
    <div class="proto" id="protoBar"><div><span class="selo">Protótipo</span><span id="protoTxt"></span></div><button id="protoX" aria-label="Fechar aviso">×</button></div>
    <section id="view" class="view"></section>
  </main>
</div>

<dialog id="dlgAsk"><div class="dlg"><h3>Confirmar</h3><p id="askMsg" style="margin:0;color:var(--mut)"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="askNo">Cancelar</button><button class="btn pri" id="askOk">OK</button></div></div></dialog>

<dialog id="dlgEntry"><form class="dlg" id="entryForm" method="dialog">
  <h3 id="entryTitle">Nova senha</h3>
  <label class="f">Serviço / nome<input class="inp" id="eTitle" required placeholder="ex.: Instagram da Cubby"></label>
  <label class="f">Usuário / e-mail<input class="inp" id="eUser" autocomplete="off"></label>
  <label class="f">Senha<div class="row" style="flex-wrap:nowrap"><input class="inp" id="ePass" type="password" autocomplete="new-password" required><button type="button" class="btn" id="eShow">ver</button><button type="button" class="btn" id="eGen">gerar</button></div></label>
  <label class="f">Endereço (URL)<input class="inp" id="eUrl" placeholder="https://"></label>
  <label class="f">Categoria<select class="inp" id="eCat"></select></label>
  <label class="f">Notas<textarea class="inp" id="eNotes" rows="3"></textarea></label>
  <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="eCancel">Cancelar</button><button class="btn pri" id="eSave">Salvar</button></div>
</form></dialog>

 };

 const d=LS.get('cubehub.dados',{});
 v.innerHTML=head('Empresa','Dados cadastrais','Os dados que você sempre precisa colar em algum cadastro. Um clique copia.')+`<div class="wrap"><div class="fields">${DADOS.map(([l,k])=>`<div class="fld"><label class="f">${l}${k==='socios'||k==='endereco'?`<textarea class="inp" rows="2" data-k="${k}">${esc(d[k]||'')}</textarea>`:`<input class="inp" data-k="${k}" value="${esc(d[k]||'')}">`}</label><button class="btn" data-c="${k}">Copiar</button></div>`).join('')}</div><p style="color:var(--mut);font-size:14px;line-height:20px;margin-top:var(--space-4)">Senhas não entram aqui. Use o <a href="#/cofre">Cofre</a>.</p></div>`;
 let t;v.oninput=e=>{const k=e.target.dataset.k;if(!k)return;const o=LS.get('cubehub.dados',{});o[k]=e.target.value;clearTimeout(t);t=setTimeout(()=>LS.set('cubehub.dados',o),300)};
 v.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const f=$(`[data-k="${b.dataset.c}"]`,v);if(f.value)copy(f.value,'Dado');else toast('Campo vazio')}}

/* ---------- cofre (criptografia AES-GCM + PBKDF2, tudo no navegador) ---------- */
const V={key:null,data:null,salt:null,iter:310000,timer:null,q:'',cat:'Todas',shown:new Set()};
const VCATS=['Redes sociais','Domínio e site','E-mail','Financeiro','Ferramentas','Outros'];
const VCC={'Redes sociais':'--brand','Domínio e site':'--pos','E-mail':'--acc-ink','Financeiro':'--caut','Ferramentas':'--mut','Outros':'--mut'};
const b64=a=>{a=new Uint8Array(a);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function vDec(key,iv,ct){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct))))}
async function saveVault(){const e=await vEnc(V.key,V.data);LS.set('cubehub.vault',{v:1,iter:V.iter,salt:V.salt,iv:e.iv,ct:e.ct})}
const seedEntries=()=>(window.VAULT_SEED||[]).map((e,i)=>({...e,id:'seed'+i+Math.random().toString(36).slice(2,6),updated:Date.now()}));
async function createVault(pw){const salt=crypto.getRandomValues(new Uint8Array(16));V.salt=b64(salt);V.iter=310000;V.key=await kdf(pw,salt,V.iter);V.data={entries:seedEntries()};await saveVault();bump()}
async function openVault(pw){const b=LS.get('cubehub.vault',null);const key=await kdf(pw,unb64(b.salt),b.iter);const data=await vDec(key,b.iv,b.ct);V.key=key;V.data=data;V.salt=b.salt;V.iter=b.iter;bump()}
function lockVault(msg){V.key=null;V.data=null;V.shown.clear();clearTimeout(V.timer);updateVaultState();if(location.hash==='#/cofre')drawVault();if(msg)toast(msg)}
function bump(){if(!V.key)return;clearTimeout(V.timer);V.timer=setTimeout(()=>lockVault('Cofre bloqueado por inatividade'),300000)}
function genPw(len=20){const cs='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*-_=+',lim=256-(256%cs.length);let o='';while(o.length<len){const b=crypto.getRandomValues(new Uint8Array(len*2));for(const x of b){if(x<lim&&o.length<len)o+=cs[x%cs.length]}}return o}
function importVault(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!(j&&j.v===1&&typeof j.salt==='string'&&typeof j.iv==='string'&&typeof j.ct==='string'&&Number.isInteger(j.iter)&&j.iter>=100000&&j.iter<=2000000))throw 0;if(LS.get('cubehub.vault',null)&&!await ask('Importar substitui o cofre que está neste navegador. Continuar?','Importar',true))return;LS.set('cubehub.vault',j);lockVault();drawVault();updateVaultState();toast('Cofre importado. Abra com a senha mestra dele.')}catch(e){toast('Arquivo inválido')}};i.click()}
async function cofre(v){
 v.innerHTML=head('Senhas','Cofre','Senhas guardadas com criptografia AES-256 neste navegador, trancadas por uma senha mestra que só você sabe.')+'<div class="wrap" id="vwrap"></div>';drawVault()}
function drawVault(){
 const w=$('#vwrap');if(!w)return;
 if(!(window.crypto&&crypto.subtle)){w.innerHTML='<div class="card"><b>Este contexto não permite criptografia.</b><p style="color:var(--mut)">Abra o arquivo direto do computador ou por um endereço https:// num navegador atual.</p></div>';return}
 if(!V.key){
  const has=!!LS.get('cubehub.vault',null);
  w.innerHTML=has?`<div class="card lock"><h3>Cofre bloqueado</h3><p>Digite a senha mestra para abrir.</p><label class="f">Senha mestra<input class="inp" id="m1" type="password" autocomplete="current-password"></label><div class="msg" id="lmsg" role="alert"></div><button class="btn pri" id="lgo">Desbloquear</button><div class="row"><button class="btn sm" id="limp">Importar cofre de um arquivo</button><button class="btn sm danger" id="lreset">Esqueci a senha</button></div></div>`
  :`<div class="card lock"><h3>Criar o cofre</h3>${window.VAULT_SEED?'<p>As contas Gmail, Instagram, TikTok e Facebook da Cubby já entram no cofre quando você criar.</p>':''}<p>Escolha uma senha mestra com 12 ou mais caracteres. <b>Se você perder essa senha, o conteúdo não tem como ser recuperado.</b> Anote em um lugar seguro, fora deste computador.</p><label class="f">Senha mestra<input class="inp" id="m1" type="password" autocomplete="new-password"></label><label class="f">Repita a senha<input class="inp" id="m2" type="password" autocomplete="new-password"></label><div class="msg" id="lmsg" role="alert"></div><button class="btn pri" id="lgo">Criar cofre</button><div class="row"><button class="btn sm" id="limp">Já tenho um cofre exportado</button></div></div>`;
  const m1=$('#m1'),go=$('#lgo'),msg=$('#lmsg');
  const run=async()=>{msg.textContent='';go.disabled=true;try{
   if(has){try{await openVault(m1.value)}catch(e){throw new Error('Senha mestra incorreta.')}}
   else{if(m1.value.length<12)throw new Error('Use 12 ou mais caracteres.');if(m1.value!==$('#m2').value)throw new Error('As duas senhas são diferentes.');await createVault(m1.value)}
   updateVaultState();drawVault()}catch(e){msg.textContent=e.message;go.disabled=false}};
  go.onclick=run;$$('input',w).forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')run()});m1.focus();
  $('#limp').onclick=importVault;
  const r=$('#lreset');if(r)r.onclick=async()=>{if(await ask('Apagar o cofre inteiro? Sem a senha mestra não há como recuperar as senhas. Só faça isso se tiver certeza de que perdeu a senha e não tem um arquivo exportado.','Apagar tudo',true)){LS.del('cubehub.vault');updateVaultState();drawVault();toast('Cofre apagado')}};
  return}
 w.innerHTML=`<div class="vbar"><button class="btn pri" id="vnew">Nova senha</button><input class="inp" id="vq" placeholder="Buscar" aria-label="Buscar" value="${esc(V.q)}">${window.VAULT_SEED?'<button class="btn" id="vseed">Adicionar contas da Cubby</button>':''}<div class="spacer"></div><button class="btn" id="vexp">Exportar cofre</button><button class="btn" id="vimp">Importar</button><button class="btn" id="vlock">Bloquear</button></div><div class="chips" id="vchips"></div><div class="entries" id="vlist"></div><p style="color:var(--mut);font-size:14px;line-height:20px;margin-top:var(--space-4)">O cofre fecha sozinho após 5 minutos parado. O arquivo exportado continua criptografado e só abre com a senha mestra. Para dar acesso ao sócio, mande o arquivo e a senha mestra por canais diferentes.</p>`;
 $('#vnew').onclick=()=>openEntry();$('#vq').oninput=e=>{V.q=e.target.value;drawEntries()};
 $('#vexp').onclick=()=>{const b=LS.get('cubehub.vault',null);if(b)dl(new Blob([JSON.stringify(b,null,2)],{type:'application/json'}),`cubby-cofre-${today()}.json`)};
 $('#vimp').onclick=importVault;const vs=$('#vseed');if(vs)vs.onclick=async()=>{const have=new Set(V.data.entries.map(e=>e.title+'|'+e.user));const add=seedEntries().filter(e=>!have.has(e.title+'|'+e.user));V.data.entries.push(...add);await saveVault();drawEntries();toast(add.length?add.length+' contas adicionadas':'Já estão no cofre')};$('#vlock').onclick=()=>lockVault('Cofre bloqueado');
 drawEntries()}
function drawEntries(){
 const E=V.data.entries,q=V.q.toLowerCase();
 $('#vchips').innerHTML=['Todas',...VCATS].map(c=>`<button class="chip ${V.cat===c?'on':''}" data-c="${esc(c)}" ${c!=='Todas'?`style="--cc:var(${VCC[c]})"`:''}>${esc(c)}</button>`).join('');
 $$('#vchips .chip').forEach(b=>b.onclick=()=>{V.cat=b.dataset.c;drawEntries()});
 const list=E.filter(e=>(V.cat==='Todas'||e.cat===V.cat)&&(!q||[e.title,e.user,e.url,e.notes].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));
 const L=$('#vlist');
 L.innerHTML=list.length?list.map(e=>{const sh=V.shown.has(e.id),link=/^https?:\/\//i.test(e.url||'')?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.url.replace(/^https?:\/\//,''))}</a>`:esc(e.url||'');
  return `<div class="entry" data-id="${e.id}"><div><div class="tt">${esc(e.title)}</div><div class="sub">${link}</div><span class="chip" style="--cc:var(${VCC[e.cat]||'--mut'});display:inline-block;margin-top:4px">${esc(e.cat)}</span></div><div class="sub">${esc(e.user||'')} ${e.user?'<button class="btn sm" data-a="cu">copiar</button>':''}</div><div><span class="spec pw">${sh?esc(e.pass):'••••••••••'}</span></div><div class="row"><button class="btn sm" data-a="show">${sh?'ocultar':'ver'}</button><button class="btn sm" data-a="cp">copiar senha</button><button class="btn sm" data-a="ed">editar</button><button class="btn sm danger" data-a="del">apagar</button></div></div>`}).join(''):`<div class="empty">${E.length?'Nada encontrado com esse filtro.':'O cofre está vazio. Clique em “Nova senha” para guardar a primeira.'}</div>`;
 L.onclick=async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const id=b.closest('.entry').dataset.id,e=E.find(x=>x.id===id);if(!e)return;
  if(b.dataset.a==='show'){V.shown.has(id)?V.shown.delete(id):V.shown.add(id);drawEntries()}
  if(b.dataset.a==='cp')copy(e.pass,'Senha',20000);
  if(b.dataset.a==='cu')copy(e.user,'Usuário');
  if(b.dataset.a==='ed')openEntry(id);
  if(b.dataset.a==='del'&&await ask(`Apagar “${e.title}” do cofre?`,'Apagar',true)){V.data.entries=E.filter(x=>x.id!==id);await saveVault();drawEntries();toast('Apagada')}}}
let editId=null;
function openEntry(id){editId=id||null;const e=id?V.data.entries.find(x=>x.id===id):{};
 $('#entryTitle').textContent=id?'Editar senha':'Nova senha';$('#eTitle').value=e.title||'';$('#eUser').value=e.user||'';$('#ePass').value=e.pass||'';$('#eUrl').value=e.url||'';$('#eNotes').value=e.notes||'';
 $('#eCat').innerHTML=VCATS.map(c=>`<option ${c===(e.cat||'Outros')?'selected':''}>${c}</option>`).join('');$('#ePass').type='password';$('#eShow').textContent='ver';$('#dlgEntry').showModal()}

/* ---------- login de acesso (porta de entrada; o cofre tem senha mestra própria) ---------- */
const LOGIN_EMAIL='cubbyoficial@gmail.com';
async function gate(done){
 const B=window.LOGIN_BLOB;if(!B||!(window.crypto&&crypto.subtle)){done();return}
 const o=document.createElement('div');o.id='gate';o.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto';
 o.innerHTML=`<form class="card" style="width:min(400px,100%);display:grid;gap:14px" autocomplete="on"><div style="width:190px">${SV('cubby:logotipo').replace('<svg ','<svg style="width:100%;height:auto" ')}</div><div><h1 style="margin:0;font:800 26px/32px var(--display)">Entrar</h1><p style="margin:4px 0 0;color:var(--mut);font-size:14px;line-height:20px">Central da marca Cubby. Acesso só para os sócios.</p></div><label class="f">E-mail<input class="inp" id="gEm" type="email" autocomplete="username" required></label><label class="f">Senha<input class="inp" id="gPw" type="password" autocomplete="current-password" required></label><div class="msg" id="gMsg" role="alert"></div><button class="btn pri" id="gGo" type="submit">Entrar</button></form>`;
 document.body.appendChild(o);$('#gEm').focus();let fails=0;
 o.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const go=$('#gGo'),m=$('#gMsg');go.disabled=true;m.textContent='';
  try{const key=await kdf($('#gEm').value.trim().toLowerCase()+'\n'+$('#gPw').value,unb64(B.salt),B.iter);const seed=await vDec(key,B.iv,B.ct);
   window.VAULT_SEED=seed.accounts&&seed.accounts.length?seed.accounts:null;o.remove();done()}
  catch(e){fails++;await new Promise(r=>setTimeout(r,Math.min(4000,600*fails)));m.textContent='E-mail ou senha incorretos.';go.disabled=false;$('#gPw').select()}}}

/* ---------- roteador e inicialização ---------- */
const PAGES={home,logos,paleta,tipografia,regras,cubby:logos,dados,cofre};
async function route(){
 const id=(location.hash.replace(/^#\/?/,'')||'home'),fn=PAGES[id]?id:'home',v=$('#view');
 v.innerHTML='';v.onclick=null;v.onchange=null;v.oninput=null;
 try{await PAGES[fn](v)}catch(e){console.error(e);v.innerHTML=`<div class="wrap"><div class="card"><b>Não consegui abrir esta página.</b><p class="msg">${esc(e.message)}</p></div></div>`}
 renderNav(fn);const info=PAGEINFO[fn];$('#crumb').innerHTML=info?`${CATL[info.cat]} / <b>${info.label}</b>`:'<b>Início</b>';
 updateVaultState();$('main').scrollTop=0}
function boot(){
 applyTheme();
 $('#themeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;LS.set('cubehub.theme',b.dataset.t);applyTheme()};
 const app=$('#app');if(innerWidth<860)app.classList.add('nosb');
 $('#toggleSide').onclick=()=>app.classList.toggle('nosb');
 $('#btnLock').onclick=()=>lockVault('Cofre bloqueado');$('#btnOut').onclick=()=>location.reload();
 $('#protoTxt').textContent='Dados e arquivos ficam só neste navegador, nada vai para servidor.'+(PERSIST?'':' Atenção: o armazenamento do navegador está bloqueado, então nada será salvo.');
 $('#protoX').onclick=()=>$('#protoBar').remove();
 $('#eShow').onclick=()=>{const i=$('#ePass'),s=i.type==='password';i.type=s?'text':'password';$('#eShow').textContent=s?'ocultar':'ver'};
 $('#eGen').onclick=()=>{$('#ePass').value=genPw(20);$('#ePass').type='text';$('#eShow').textContent='ocultar'};
 $('#eCancel').onclick=()=>$('#dlgEntry').close();
 $('#entryForm').addEventListener('submit',async ev=>{ev.preventDefault();
  const o={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:$('#eTitle').value.trim(),user:$('#eUser').value.trim(),pass:$('#ePass').value,url:$('#eUrl').value.trim(),cat:$('#eCat').value,notes:$('#eNotes').value.trim(),updated:Date.now()};
  if(!o.title||!o.pass)return;
  const E=V.data.entries,i=E.findIndex(x=>x.id===o.id);if(i>=0)E[i]=o;else E.push(o);
  try{await saveVault();$('#dlgEntry').close();drawEntries();toast('Salvo')}catch(e){toast('Erro ao salvar: '+e.message)}});
 ['pointerdown','keydown'].forEach(t=>document.addEventListener(t,bump,true));
 addEventListener('hashchange',()=>{if(innerWidth<860)app.classList.add('nosb');route()});
 route()}
gate(boot);
</script>
